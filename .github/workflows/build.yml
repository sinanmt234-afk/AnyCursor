name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r windows/requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name AnyCursor --collect-all mediapipe --collect-all customtkinter --paths windows windows/app.py
      - uses: actions/upload-artifact@v4
        with: { name: AnyCursor-Windows, path: dist/AnyCursor }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build APK
        working-directory: android_app
        run: |
          mkdir /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create . --platforms=android --project-name any_track
          rm -rf lib && cp -r /tmp/keep/lib . && cp /tmp/keep/pubspec.yaml .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"AnyTrack\"/" $M
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: AnyTrack-Android, path: android_app/build/app/outputs/flutter-apk/app-release.apk }
